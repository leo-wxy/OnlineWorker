name: Release DMG

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-dmg:
    name: Build ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ONLINEWORKER_TARGET_TRIPLE: ${{ matrix.target }}
      BUNDLE_ROOT: mac-app/src-tauri/target/${{ matrix.target }}/release/bundle
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive

      - name: Setup Python 3.13
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      - name: Check tag and packaging versions
        run: python scripts/sync-app-version.py --check --tag "$RELEASE_TAG"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Prepare signing and notarization
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          configured=false
          for name in "${required[@]}"; do
            if [ -n "${!name}" ]; then configured=true; fi
          done
          if [ "$configured" = false ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple release credentials are not configured; producing an unnotarized development build"
            exit 0
          fi
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Incomplete release credentials: missing $name"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/onlineworker-certificate.p12"
          keychain="$RUNNER_TEMP/onlineworker-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "\"$APPLE_SIGNING_IDENTITY\""
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.signed == 'true' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.signed }}
          ONLINEWORKER_DMG_ARCH: ${{ matrix.arch }}
        run: |
          if bash scripts/build.sh; then
            exit 0
          fi
          if [ "$SIGNED_RELEASE" = true ]; then
            echo "::error::Signed build failed; refusing a fallback that could bypass notarization"
            exit 1
          fi
          echo "::warning::Tauri DMG bundling failed; trying the headless fallback"
          ONLINEWORKER_APP_BUNDLE_PATH="$BUNDLE_ROOT/macos/OnlineWorker.app" \
            ONLINEWORKER_DMG_OUTPUT_DIR="$BUNDLE_ROOT/dmg" \
            bash scripts/create-dmg-from-app.sh

      - name: Verify app version, architecture and signing
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.signed }}
        run: |
          app="$BUNDLE_ROOT/macos/OnlineWorker.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${RELEASE_TAG#v}"
          for binary in onlineworker-app onlineworker-bot ccusage; do
            test "$(lipo -archs "$app/Contents/MacOS/$binary")" = "$EXPECTED_ARCH"
          done
          codesign --verify --deep --strict "$app"
          if [ "$SIGNED_RELEASE" = true ]; then
            team="$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            test "$team" = "$APPLE_TEAM_ID"
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlineworker-dmg-${{ env.RELEASE_TAG }}-${{ matrix.arch }}
          path: ${{ env.BUNDLE_ROOT }}/dmg/*.dmg
          if-no-files-found: error

  publish-release:
    needs: build-dmg
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: onlineworker-dmg-${{ env.RELEASE_TAG }}-*
          path: release-dmg
          merge-multiple: true
      - name: Publish both architectures
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --title "$RELEASE_TAG" --notes "Automated release for $RELEASE_TAG")
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-dmg/*.dmg --clobber
