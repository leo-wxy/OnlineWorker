<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>回调已收到 · OnlineWorker</title>
    <script>
      window.history.replaceState(null, document.title, window.location.pathname);
      window.addEventListener("DOMContentLoaded", () => {
        const closeButton = document.getElementById("close-page");
        const closeHint = document.getElementById("close-hint");
        closeButton.addEventListener("click", () => {
          window.close();
          window.setTimeout(() => { closeHint.hidden = false; }, 250);
        });
      });
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --page: #f3f6fa;
        --panel: #ffffff;
        --line: #dfe5ec;
        --text: #172033;
        --muted: #657286;
        --blue: #245eea;
        --blue-soft: #eaf0ff;
        --shadow: 0 18px 48px rgba(30, 48, 75, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        background: var(--page);
      }

      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: var(--blue);
        font-size: 13px;
        font-weight: 750;
      }

      .status-mark {
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: var(--blue-soft);
        font-size: 15px;
      }

      h1 {
        margin: 22px 0 10px;
        font-size: clamp(26px, 6vw, 34px);
        line-height: 1.18;
        letter-spacing: -0.035em;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .actions p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      button {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid var(--blue);
        border-radius: 10px;
        color: #ffffff;
        background: var(--blue);
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--blue) 30%, transparent);
        outline-offset: 3px;
      }

      [hidden] {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #111a29;
          --panel: #192538;
          --line: #2d3c52;
          --text: #edf2f8;
          --muted: #a6b3c4;
          --blue: #78a7ff;
          --blue-soft: #243a60;
          --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
        }

        button {
          color: #101827;
        }
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
        }

        main {
          padding: 24px;
          border-radius: 14px;
        }

        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status"><span class="status-mark" aria-hidden="true">✓</span>授权回调已接收</p>
      <h1>请返回 OnlineWorker 查看结果</h1>
      <p class="lead">本地回调已安全接收。授权和账号导入仍需在应用内验证，此页面不会显示回调参数或最终结果。</p>
      <div class="actions">
        <p id="close-hint" hidden aria-live="polite">浏览器未自动关闭，请手动关闭此标签页。</p>
        <p>你可以安全关闭此页面。</p>
        <button id="close-page" type="button">关闭页面</button>
      </div>
    </main>
  </body>
</html>
