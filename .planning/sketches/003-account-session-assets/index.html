<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OnlineWorker 会话资产 UI Sketch</title>
  <link rel="stylesheet" href="../themes/default.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow-x: hidden; color: var(--color-text); background: var(--color-bg); font-family: var(--font-sans); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(40, 89, 232, .18); outline-offset: 2px; }
    .variant-nav { position: fixed; inset: 0 0 auto; z-index: 50; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-bottom: 1px solid var(--color-border); background: rgba(255,255,255,.92); backdrop-filter: blur(18px); }
    .variant-tab { border: 1px solid transparent; border-radius: 12px; padding: 8px 14px; color: var(--color-text-muted); background: transparent; font-size: 13px; font-weight: 750; transition: all .15s ease; }
    .variant-tab:hover { color: var(--color-text); background: var(--color-surface-soft); }
    .variant-tab.active { border-color: var(--color-border); color: var(--color-primary); background: var(--color-surface); box-shadow: var(--shadow-sm); }
    #viewport { width: 100%; min-height: 100vh; margin: 0 auto; padding-top: 50px; transition: max-width .2s ease; }
    #viewport.tablet { max-width: 860px; box-shadow: var(--shadow-lg); }
    #viewport.phone { max-width: 430px; box-shadow: var(--shadow-lg); }
    .variant { display: none; min-height: calc(100vh - 50px); }
    .variant.active { display: block; }
    .shell { display: grid; grid-template-columns: 188px minmax(0,1fr); min-height: calc(100vh - 50px); }
    .sidebar { position: sticky; top: 50px; display: flex; height: calc(100vh - 50px); flex-direction: column; gap: 18px; padding: 20px 14px; border-right: 1px solid var(--color-border); background: rgba(240,244,250,.8); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid rgba(255,255,255,.9); border-radius: 18px; background: rgba(255,255,255,.82); box-shadow: var(--shadow-sm); }
    .brand-mark { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border-radius: 13px; color: white; background: var(--color-primary); font-weight: 900; }
    .brand strong { display: block; font-size: 13px; }
    .brand small { display: block; margin-top: 2px; color: var(--color-text-muted); font-size: 9px; }
    .nav { display: grid; gap: 5px; }
    .nav-item { display: flex; align-items: center; gap: 10px; border: 0; border-radius: 13px; padding: 9px 10px; color: var(--color-text-muted); background: transparent; font-size: 12px; font-weight: 700; text-align: left; transition: all .15s ease; }
    .nav-item:hover { color: var(--color-text); background: rgba(255,255,255,.58); }
    .nav-item.active { color: var(--color-text); background: white; box-shadow: var(--shadow-sm), inset 3px 0 var(--color-primary); }
    .nav-icon { display: grid; width: 26px; height: 26px; flex: 0 0 auto; place-items: center; border-radius: 9px; color: var(--color-text-muted); background: #e8edf5; }
    .sidebar-bottom { margin-top: auto; display: grid; gap: 8px; }
    .service { padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 14px; color: var(--color-success); background: var(--color-surface); font-size: 10px; font-weight: 750; }
    .main { min-width: 0; padding: 28px 30px 48px; }
    .page { width: min(100%, 1080px); margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
    .page-head h1 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
    .page-head p { margin: 5px 0 0; color: var(--color-text-muted); font-size: 12px; }
    .account-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 18px; padding: 4px; border: 1px solid var(--color-border); border-radius: 15px; background: #edf1f7; }
    .account-tabs button { border: 0; border-radius: 11px; padding: 8px; color: var(--color-text-muted); background: transparent; font-size: 12px; font-weight: 800; }
    .account-tabs button.active { color: var(--color-primary); background: white; box-shadow: var(--shadow-sm); }
    .summary-panel { display: grid; grid-template-columns: minmax(210px,.78fr) minmax(0,1.65fr); overflow: hidden; margin-bottom: 14px; border: 1px solid var(--color-border); border-radius: var(--radius-xl); background: var(--color-surface); box-shadow: var(--shadow-sm); }
    .summary-lead { position: relative; padding: 20px 22px; background: linear-gradient(145deg, var(--color-primary-soft), #f8faff 72%); }
    .summary-lead::after { position: absolute; right: -38px; bottom: -46px; width: 140px; height: 140px; border: 24px solid rgba(40,89,232,.05); border-radius: 50%; content: ""; }
    .eyebrow { color: var(--color-primary); font-size: 10px; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .summary-total { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; }
    .summary-total strong { font-size: 30px; line-height: 1; letter-spacing: -.04em; }
    .summary-total span { color: var(--color-text-muted); font-size: 11px; font-weight: 700; }
    .summary-caption { position: relative; z-index: 1; margin: 9px 0 0; color: var(--color-text-muted); font-size: 11px; line-height: 1.5; }
    .metric-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); align-items: center; padding: 14px; }
    .metric { min-width: 0; padding: 8px 14px; border-left: 1px solid var(--color-border); }
    .metric:first-child { border-left: 0; }
    .metric span { display: block; color: var(--color-text-muted); font-size: 10px; font-weight: 700; }
    .metric strong { display: block; overflow: hidden; margin-top: 6px; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .panel { overflow: hidden; border: 1px solid var(--color-border); border-radius: var(--radius-xl); background: var(--color-surface); box-shadow: var(--shadow-md); }
    .panel-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--color-border); }
    .panel-title-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
    .panel-title-row h2 { margin: 0; font-size: 15px; }
    .panel-title-row p { margin: 3px 0 0; color: var(--color-text-muted); font-size: 10px; }
    .mode-switch { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--color-border); border-radius: 11px; background: var(--color-surface-soft); }
    .mode-switch button { border: 0; border-radius: 8px; padding: 6px 9px; color: var(--color-text-muted); background: transparent; font-size: 10px; font-weight: 750; }
    .mode-switch button.active { color: var(--color-text); background: white; box-shadow: var(--shadow-sm); }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    .search-wrap { position: relative; min-width: 220px; flex: 1; }
    .search-wrap::before { position: absolute; top: 50%; left: 12px; color: var(--color-text-subtle); content: "⌕"; transform: translateY(-54%); }
    .search { width: 100%; height: 38px; border: 1px solid var(--color-border); border-radius: 12px; padding: 0 12px 0 33px; color: var(--color-text); background: var(--color-surface-soft); font-size: 11px; transition: all .15s ease; }
    .search:focus { border-color: var(--color-primary); background: white; outline: 3px solid rgba(40,89,232,.12); }
    .select { height: 38px; border: 1px solid var(--color-border); border-radius: 12px; padding: 0 30px 0 11px; color: var(--color-text); background: white; font-size: 11px; font-weight: 700; }
    .button { display: inline-flex; height: 38px; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--color-border); border-radius: 12px; padding: 0 12px; color: var(--color-text-muted); background: white; font-size: 11px; font-weight: 750; transition: all .15s ease; }
    .button:hover { border-color: var(--color-border-strong); color: var(--color-text); background: var(--color-surface-soft); }
    .button.primary { border-color: var(--color-primary); color: white; background: var(--color-primary); }
    .button.primary:hover { background: var(--color-primary-hover); }
    .button.danger { border-color: #f4cfd4; color: var(--color-danger); background: var(--color-danger-soft); }
    .context-bar { display: none; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; border-bottom: 1px solid #d7e2ff; color: var(--color-primary); background: var(--color-primary-soft); font-size: 11px; font-weight: 750; }
    .context-bar.show { display: flex; }
    .context-actions { display: flex; gap: 7px; }
    .context-actions button { border: 1px solid rgba(40,89,232,.18); border-radius: 9px; padding: 6px 9px; color: var(--color-primary); background: white; font-size: 10px; font-weight: 750; }
    .list { min-height: 430px; padding: 8px; background: #fbfcfe; }
    .group { overflow: hidden; margin-bottom: 7px; border: 1px solid transparent; border-radius: 15px; background: white; transition: all .15s ease; }
    .group:last-child { margin-bottom: 0; }
    .group:hover { border-color: var(--color-border); box-shadow: var(--shadow-sm); }
    .group.open { border-color: #d6e0f4; box-shadow: var(--shadow-sm); }
    .group-row { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto auto auto; align-items: center; gap: 11px; min-height: 58px; padding: 9px 13px; cursor: pointer; }
    .check { width: 15px; height: 15px; accent-color: var(--color-primary); }
    .folder { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: var(--color-primary); background: var(--color-primary-soft); }
    .folder svg { width: 17px; height: 17px; }
    .group-copy { min-width: 0; }
    .group-copy strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .group-copy small { display: block; overflow: hidden; margin-top: 3px; color: var(--color-text-subtle); font-family: var(--font-mono); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .count { min-width: 68px; border: 1px solid var(--color-border); border-radius: var(--radius-full); padding: 5px 9px; color: var(--color-text-muted); background: var(--color-surface-soft); font-size: 9px; font-weight: 750; text-align: center; }
    .time { width: 55px; color: var(--color-text-muted); font-size: 10px; font-weight: 700; text-align: right; }
    .chevron { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 8px; color: var(--color-text-subtle); background: transparent; transition: all .15s ease; }
    .group.open .chevron { color: var(--color-primary); background: var(--color-primary-soft); transform: rotate(90deg); }
    .conversation-list { display: none; margin: 0 12px 12px 72px; overflow: hidden; border: 1px solid var(--color-border); border-radius: 13px; background: var(--color-surface-soft); }
    .group.open .conversation-list { display: block; }
    .conversation { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
    .conversation:last-child { border-bottom: 0; }
    .conversation:hover { background: white; }
    .conversation strong { display: block; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .conversation span { display: block; margin-top: 3px; color: var(--color-text-subtle); font-size: 9px; }
    .conversation time { color: var(--color-text-muted); font-size: 9px; font-weight: 650; }
    .card-board { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; padding: 14px; background: #fbfcfe; }
    .project-card { display: flex; min-width: 0; flex-direction: column; border: 1px solid var(--color-border); border-radius: 18px; background: white; box-shadow: var(--shadow-sm); transition: all .15s ease; }
    .project-card:hover { border-color: #cbd8f4; transform: translateY(-1px); box-shadow: var(--shadow-md); }
    #variant-c .project-card { min-height: 220px; }
    .project-card-head { display: flex; align-items: flex-start; gap: 11px; padding: 15px; }
    .project-card-copy { min-width: 0; flex: 1; }
    .project-card-copy strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .project-card-copy small { display: block; overflow: hidden; margin-top: 4px; color: var(--color-text-subtle); font-family: var(--font-mono); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .project-card-meta { display: flex; align-items: center; justify-content: space-between; padding: 0 15px 12px; color: var(--color-text-muted); font-size: 9px; font-weight: 700; }
    .recent { margin: 0 12px 12px; padding: 5px; border-radius: 12px; background: var(--color-surface-soft); }
    .recent-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 8px; border-radius: 9px; color: var(--color-text-muted); font-size: 9px; }
    .recent-item:hover { color: var(--color-text); background: white; }
    .recent-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-item time { flex: 0 0 auto; color: var(--color-text-subtle); }
    .session-picker { margin: auto 12px 12px; border: 1px solid #d6e0f4; border-radius: 11px; padding: 9px 11px; color: var(--color-primary); background: var(--color-primary-soft); font-size: 10px; font-weight: 800; transition: all .15s ease; }
    .session-picker:hover { border-color: var(--color-primary); background: #e7edff; }
    .selected-badge { display: none; margin-left: auto; border-radius: var(--radius-full); padding: 4px 8px; color: var(--color-primary); background: var(--color-primary-soft); font-size: 9px; font-weight: 800; }
    .selected-badge.show { display: inline-flex; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(15,23,42,.38); backdrop-filter: blur(7px); }
    .modal-backdrop.open { display: flex; }
    .modal-card { width: min(620px,100%); max-height: min(720px,calc(100vh - 48px)); overflow: hidden; border: 1px solid rgba(255,255,255,.7); border-radius: 22px; background: white; box-shadow: 0 24px 80px rgba(15,23,42,.22); }
    .modal-head { display: flex; align-items: flex-start; gap: 14px; padding: 20px 22px 16px; border-bottom: 1px solid var(--color-border); }
    .modal-head-copy { min-width: 0; flex: 1; }
    .modal-head h3 { margin: 0; font-size: 17px; }
    .modal-head p { overflow: hidden; margin: 5px 0 0; color: var(--color-text-muted); font-family: var(--font-mono); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .modal-close { width: 32px; height: 32px; border: 0; border-radius: 10px; color: var(--color-text-muted); background: var(--color-surface-soft); }
    .modal-controls { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; padding: 14px 22px; border-bottom: 1px solid var(--color-border); background: #fbfcfe; }
    .modal-search { height: 38px; border: 1px solid var(--color-border); border-radius: 11px; padding: 0 12px; background: white; font-size: 11px; }
    .select-all { display: flex; align-items: center; gap: 7px; border: 1px solid var(--color-border); border-radius: 11px; padding: 0 12px; color: var(--color-text-muted); background: white; font-size: 10px; font-weight: 750; }
    .modal-list { max-height: 390px; overflow: auto; padding: 8px 14px; }
    .modal-session { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 11px; border-radius: 12px; padding: 11px 9px; transition: all .15s ease; }
    .modal-session:hover { background: var(--color-surface-soft); }
    .modal-session strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .modal-session small { display: block; margin-top: 3px; color: var(--color-text-subtle); font-family: var(--font-mono); font-size: 8px; }
    .modal-session time { color: var(--color-text-muted); font-size: 9px; font-weight: 700; }
    .modal-empty { padding: 42px 16px; color: var(--color-text-muted); font-size: 11px; text-align: center; }
    .modal-footer { display: flex; align-items: center; gap: 9px; padding: 14px 22px; border-top: 1px solid var(--color-border); background: #fbfcfe; }
    .modal-footer span { margin-right: auto; color: var(--color-text-muted); font-size: 10px; font-weight: 750; }
    .modal-footer button { height: 36px; border: 1px solid var(--color-border); border-radius: 11px; padding: 0 14px; color: var(--color-text-muted); background: white; font-size: 10px; font-weight: 800; }
    .modal-footer button.primary { border-color: var(--color-primary); color: white; background: var(--color-primary); }
    .toast { position: fixed; z-index: 80; right: 22px; bottom: 22px; max-width: 320px; padding: 11px 14px; border: 1px solid #cfe9df; border-radius: 13px; color: var(--color-success); background: var(--color-success-soft); box-shadow: var(--shadow-md); font-size: 11px; font-weight: 750; opacity: 0; transform: translateY(8px); pointer-events: none; transition: all .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    #sketch-tools { position: fixed; z-index: 90; right: 12px; bottom: 12px; display: flex; gap: 5px; padding: 7px 9px; border-radius: 10px; color: white; background: rgba(15,23,42,.76); font: 11px system-ui; opacity: .45; transition: opacity .2s; }
    #sketch-tools:hover { opacity: 1; }
    #sketch-tools button, #sketch-tools select { border: 0; border-radius: 6px; padding: 4px 7px; color: white; background: rgba(255,255,255,.14); font-size: 10px; }
    .viewport.tablet .shell { grid-template-columns: 76px minmax(0,1fr); }
    .viewport.tablet .brand-copy, .viewport.tablet .nav-label, .viewport.tablet .service { display: none; }
    .viewport.tablet .brand { justify-content: center; padding: 10px; }
    .viewport.tablet .nav-item { justify-content: center; }
    .viewport.tablet .main { padding: 22px 18px 40px; }
    .viewport.tablet .metric-grid { grid-template-columns: repeat(2,1fr); }
    .viewport.tablet .metric:nth-child(3) { border-left: 0; }
    .viewport.tablet .toolbar { flex-wrap: wrap; }
    .viewport.tablet .search-wrap { flex-basis: 100%; }
    .viewport.phone .shell { display: block; }
    .viewport.phone .sidebar { display: none; }
    .viewport.phone .main { padding: 18px 12px 32px; }
    .viewport.phone .summary-panel { grid-template-columns: 1fr; }
    .viewport.phone .metric-grid { grid-template-columns: repeat(2,1fr); }
    .viewport.phone .metric:nth-child(3) { border-left: 0; }
    .viewport.phone .toolbar { flex-wrap: wrap; }
    .viewport.phone .search-wrap { flex-basis: 100%; }
    .viewport.phone .button span { display: none; }
    .viewport.phone .group-row { grid-template-columns: auto auto minmax(0,1fr) auto; }
    .viewport.phone .count, .viewport.phone .time { display: none; }
    .viewport.phone .conversation-list { margin-left: 12px; }
    .viewport.phone .card-board { grid-template-columns: 1fr; }
    @media (max-width: 900px) { .shell { grid-template-columns: 84px minmax(0,1fr); } .brand-copy, .nav-label, .service { display: none; } .brand, .nav-item { justify-content: center; } .main { padding-inline: 20px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <nav class="variant-nav" aria-label="设计方案">
    <button class="variant-tab" data-variant="a">A · 整块会话工作台</button>
    <button class="variant-tab" data-variant="b">B · 工程卡片流</button>
    <button class="variant-tab active" data-variant="c">C · 卡片流 + 选择弹窗 ★</button>
  </nav>
  <main id="viewport" class="viewport desktop">
    <section id="variant-a" class="variant"></section>
    <section id="variant-b" class="variant"></section>
    <section id="variant-c" class="variant active"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <div id="session-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <section class="modal-card">
      <header class="modal-head"><span class="folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></svg></span><div class="modal-head-copy"><h3 id="modal-title">选择会话</h3><p id="modal-path"></p></div><button class="modal-close" data-modal-close aria-label="关闭">×</button></header>
      <div class="modal-controls"><input id="modal-search" class="modal-search" placeholder="搜索当前工程的会话" /><label class="select-all"><input id="modal-select-all" type="checkbox" /> 全选</label></div>
      <div id="modal-list" class="modal-list"></div>
      <footer class="modal-footer"><span id="modal-count">已选择 0 个会话</span><button data-modal-close>取消</button><button id="modal-confirm" class="primary">确认选择</button></footer>
    </section>
  </div>
  <div id="sketch-tools">
    <select aria-label="主题"><option>OnlineWorker Light</option></select>
    <button data-width="desktop">桌面</button><button data-width="tablet">平板</button><button data-width="phone">手机</button>
  </div>
  <script>
    const folderIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 6.8h6l1.8 2h9.2v8.7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V6.8Z"/><path d="M3.5 9h17"/></svg>';
    const groups = [
      { id:'onlineworker-combined', path:'~/Projects/onlineworker-combined', count:8, time:'1 分钟', items:[['完善账号与会话资产 UI','刚刚'],['打包验证 OnlineWorker','8 分钟'],['OAuth callback 页面设计','2 小时']] },
      { id:'ClipAll', path:'~/Projects/ClipAll', count:1, time:'1 分钟', items:[['修复剪贴板同步状态','1 分钟']] },
      { id:'music_app', path:'~/Projects/music4/music_app', count:1, time:'2 天', items:[['私信语音播放 ANR','2 天']] },
      { id:'CloudMusicHarmony', path:'~/Projects/jsi-harmony-260830/CloudMusicHarmony', count:7, time:'3 天', items:[['Harmony 播放调试页','3 天'],['缓存链路分析','3 天']] },
      { id:'react-native-ncmaudioplayer', path:'~/Projects/jsi-harmony-260730/react-native-ncmaudioplayer', count:3, time:'4 天', items:[['PlaybackConfig 迁移','4 天']] },
      { id:'nm_common_cache', path:'~/Projects/nm_common_cache', count:10, time:'1 周', items:[['AAR crash symbolization','1 周'],['teardown 最小修复','1 周']] },
      { id:'music_biz_player', path:'~/Projects/hotpatch/music_app/module_source/music_biz_player', count:9, time:'2 周', items:[['播放器 callback contract','2 周']] },
      { id:'raven', path:'~/.raven', count:1, time:'5 天', items:[['session inventory guard','5 天']] }
    ];
    const open = new Set(['onlineworker-combined']);
    let selectedSessions = new Set();
    let draftSessions = new Set();
    let modalGroup = null;

    function sidebar(){ return `<aside class="sidebar"><div class="brand"><div class="brand-mark">ϟ</div><div class="brand-copy"><strong>OnlineWorker</strong><small>Local AI workbench</small></div></div><nav class="nav">${['总览','任务','会话','用量','AI','命令','通知','设置','账号'].map((x,i)=>`<button class="nav-item ${x==='账号'?'active':''}"><span class="nav-icon">${i+1}</span><span class="nav-label">${x}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="service">● Service Active<br><span style="color:var(--color-text-muted);font-weight:600">OnlineWorker</span></div></div></aside>`; }
    function header(){ return `<div class="page-head"><div><h1>会话资产</h1><p>按工作目录管理本地会话资产。</p></div></div><div class="account-tabs"><button>账号</button><button class="active">会话资产</button></div>`; }
    function summary(){ return `<section class="summary-panel"><div class="summary-lead"><span class="eyebrow">近 30 天</span><div class="summary-total"><strong>26 亿</strong><span>Token 合计</span></div><p class="summary-caption">35 个工作目录 · 79 个会话<br>基于当前 Codex Home 本地数据</p></div><div class="metric-grid"><div class="metric"><span>输入</span><strong>25.7 亿</strong></div><div class="metric"><span>缓存</span><strong>24.8 亿</strong></div><div class="metric"><span>输出</span><strong>945.2 万</strong></div><div class="metric"><span>费用</span><strong>不可用</strong></div></div></section>`; }
    function toolbar(variant){ return `<div class="panel-head"><div class="panel-title-row"><div><h2>当前对话</h2><p>按最近活动排序 · 默认折叠工作目录</p></div><div class="mode-switch"><button class="active">当前会话</button><button>废纸篓</button></div></div><div class="toolbar"><label class="search-wrap"><input class="search" data-search="${variant}" placeholder="搜索会话标题或工作目录" /></label><select class="select"><option>对话</option><option>全部类型</option></select><button class="button" data-toast="选择一个 ZIP 文件导入"><b>＋</b><span>导入</span></button><button class="button" data-toast="可见性检查完成：无需修复"><b>◎</b><span>修复</span></button><button class="button" data-toast="会话列表已刷新"><b>↻</b><span>刷新</span></button></div></div><div class="context-bar" data-context="${variant}"><span data-selected-count>已选择 0 个会话</span><div class="context-actions"><button data-toast="准备导出所选会话">导出选中</button><button data-toast="所选会话将移到可恢复的废纸篓">移到废纸篓</button><button data-clear="${variant}">清除</button></div></div>`; }
    function groupRows(items){ return items.map(g=>`<article class="group ${open.has(g.id)?'open':''}" data-group="${g.id}" data-name="${(g.id+' '+g.path+' '+g.items.map(i=>i[0]).join(' ')).toLowerCase()}"><div class="group-row"><input class="check" type="checkbox" data-check="${g.id}" aria-label="选择 ${g.id}"/><span class="folder">${folderIcon}</span><span class="group-copy"><strong>${g.id}</strong><small>${g.path}</small></span><span class="count">${g.count} 个对话</span><time class="time">${g.time}</time><span class="chevron">›</span></div><div class="conversation-list">${g.items.map((item,index)=>`<div class="conversation"><input class="check" type="checkbox" aria-label="选择 ${item[0]}"/><span><strong>${item[0]}</strong><span>session · ${g.id.slice(0,8)}-${index+1}</span></span><time>${item[1]}</time></div>`).join('')}</div></article>`).join(''); }
    function cards(items){ return items.map(g=>`<article class="project-card" data-name="${(g.id+' '+g.path+' '+g.items.map(i=>i[0]).join(' ')).toLowerCase()}"><div class="project-card-head"><input class="check" type="checkbox" data-check="${g.id}" aria-label="选择 ${g.id}"/><span class="folder">${folderIcon}</span><span class="project-card-copy"><strong>${g.id}</strong><small>${g.path}</small></span><button class="button" style="width:30px;height:30px;padding:0" data-toast="已展开 ${g.id}">›</button></div><div class="project-card-meta"><span>${g.count} 个对话</span><span>最近活动 ${g.time}</span></div><div class="recent">${g.items.slice(0,2).map(i=>`<div class="recent-item"><span>${i[0]}</span><time>${i[1]}</time></div>`).join('')}</div></article>`).join(''); }
    function pickerCards(items){ return items.map(g=>`<article class="project-card" data-project="${g.id}" data-name="${(g.id+' '+g.path+' '+g.items.map(i=>i[0]).join(' ')).toLowerCase()}"><div class="project-card-head"><span class="folder">${folderIcon}</span><span class="project-card-copy"><strong>${g.id}</strong><small>${g.path}</small></span><span class="selected-badge" data-selected-badge="${g.id}"></span></div><div class="project-card-meta"><span>${g.count} 个对话</span><span>最近活动 ${g.time}</span></div><div class="recent">${g.items.slice(0,2).map(i=>`<div class="recent-item"><span>${i[0]}</span><time>${i[1]}</time></div>`).join('')}</div><button class="session-picker" data-open-sessions="${g.id}">选择会话 ›</button></article>`).join(''); }
    function shell(content){ return `<div class="shell">${sidebar()}<div class="main"><div class="page">${header()}${summary()}${content}</div></div></div>`; }
    document.querySelector('#variant-a').innerHTML = shell(`<section class="panel">${toolbar('a')}<div class="list" data-list="a">${groupRows(groups)}</div></section>`);
    document.querySelector('#variant-b').innerHTML = shell(`<section class="panel">${toolbar('b')}<div class="card-board" data-list="b">${cards(groups)}</div></section>`);
    document.querySelector('#variant-c').innerHTML = shell(`<section class="panel">${toolbar('c')}<div class="card-board" data-list="c">${pickerCards(groups)}</div></section>`);

    function toast(message){ const el=document.querySelector('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>el.classList.remove('show'),1600); }
    function sessionsFor(group){ const rows=group.items.map((item,index)=>({id:`${group.id}-${index+1}`,title:item[0],time:item[1]})); for(let index=rows.length;index<Math.min(group.count,6);index++) rows.push({id:`${group.id}-${index+1}`,title:`历史会话 ${index+1}`,time:group.time}); return rows; }
    function updateContext(variant){ const bar=document.querySelector(`[data-context="${variant}"]`); const count=variant==='c'?selectedSessions.size:document.querySelectorAll(`#variant-${variant} [data-check]:checked`).length; bar.classList.toggle('show',count>0); bar.querySelector('[data-selected-count]').textContent=variant==='c'?`已选择 ${count} 个会话`:`已选择 ${count} 个工作目录`; }
    function updateBadges(){ groups.forEach(group=>{ const count=sessionsFor(group).filter(session=>selectedSessions.has(session.id)).length; const badge=document.querySelector(`[data-selected-badge="${group.id}"]`); badge.textContent=`已选 ${count}`; badge.classList.toggle('show',count>0); }); updateContext('c'); }
    function renderModal(filter=''){ const sessions=sessionsFor(modalGroup); const visible=sessions.filter(session=>session.title.toLowerCase().includes(filter.toLowerCase())); document.querySelector('#modal-list').innerHTML=visible.length?visible.map(session=>`<label class="modal-session"><input class="check" type="checkbox" data-modal-session="${session.id}" ${draftSessions.has(session.id)?'checked':''}/><span><strong>${session.title}</strong><small>session · ${session.id}</small></span><time>${session.time}</time></label>`).join(''):'<div class="modal-empty">没有匹配的会话</div>'; const selectedCount=sessions.filter(session=>draftSessions.has(session.id)).length; document.querySelector('#modal-count').textContent=`已选择 ${selectedCount} / ${sessions.length} 个会话`; document.querySelector('#modal-select-all').checked=selectedCount===sessions.length; }
    function openModal(groupId){ modalGroup=groups.find(group=>group.id===groupId); draftSessions=new Set(selectedSessions); document.querySelector('#modal-title').textContent=modalGroup.id; document.querySelector('#modal-path').textContent=modalGroup.path; document.querySelector('#modal-search').value=''; renderModal(); document.querySelector('#session-modal').classList.add('open'); }
    function closeModal(){ document.querySelector('#session-modal').classList.remove('open'); modalGroup=null; }
    document.addEventListener('click',event=>{
      const tab=event.target.closest('.variant-tab'); if(tab){ document.querySelectorAll('.variant-tab').forEach(x=>x.classList.toggle('active',x===tab)); document.querySelectorAll('.variant').forEach(x=>x.classList.toggle('active',x.id===`variant-${tab.dataset.variant}`)); return; }
      const picker=event.target.closest('[data-open-sessions]'); if(picker){ openModal(picker.dataset.openSessions); return; }
      if(event.target.matches('[data-modal-close]') || event.target===document.querySelector('#session-modal')){ closeModal(); return; }
      if(event.target===document.querySelector('#modal-confirm')){ selectedSessions=new Set(draftSessions); updateBadges(); closeModal(); toast('会话选择已更新'); return; }
      const row=event.target.closest('.group-row'); if(row && !event.target.matches('input')) row.closest('.group').classList.toggle('open');
      const action=event.target.closest('[data-toast]'); if(action) toast(action.dataset.toast);
      const clear=event.target.closest('[data-clear]'); if(clear){ if(clear.dataset.clear==='c'){ selectedSessions.clear(); updateBadges(); } else { document.querySelectorAll(`#variant-${clear.dataset.clear} [data-check]`).forEach(x=>x.checked=false); updateContext(clear.dataset.clear); } }
    });
    document.addEventListener('change',event=>{ if(event.target.matches('[data-check]')) updateContext(event.target.closest('.variant').id.slice(-1)); if(event.target.matches('[data-modal-session]')){ event.target.checked?draftSessions.add(event.target.dataset.modalSession):draftSessions.delete(event.target.dataset.modalSession); renderModal(document.querySelector('#modal-search').value); } if(event.target===document.querySelector('#modal-select-all')){ sessionsFor(modalGroup).forEach(session=>event.target.checked?draftSessions.add(session.id):draftSessions.delete(session.id)); renderModal(document.querySelector('#modal-search').value); } });
    document.addEventListener('input',event=>{ if(event.target===document.querySelector('#modal-search')){ renderModal(event.target.value); return; } if(!event.target.matches('[data-search]')) return; const value=event.target.value.trim().toLowerCase(); document.querySelectorAll(`#variant-${event.target.dataset.search} [data-name]`).forEach(x=>x.style.display=x.dataset.name.includes(value)?'':'none'); });
    document.addEventListener('keydown',event=>{ if(event.key==='Escape' && document.querySelector('#session-modal').classList.contains('open')) closeModal(); });
    document.querySelectorAll('#sketch-tools [data-width]').forEach(button=>button.addEventListener('click',()=>{ const v=document.querySelector('#viewport'); v.className=`viewport ${button.dataset.width}`; }));
  </script>
</body>
</html>
